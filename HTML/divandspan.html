<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div and span tag</title>
    <style>
        div{
            background-color: aqua;
            display: inline;
        }
        .div_class{
            background-color: aquamarine;
            display: block;
        }
        #div_id{
            background-color: burlywood;
            display: block;
        }
        span{
            background-color: brown;
            font: larger;
        }
    </style>
</head>
<body>
    <div>This is first div tag</div>
    <div>This is second div tag</div>

    <div class="div_class">This is third div tag</div>
    <div id="div_id">This is fourth div tag</div>

    <span>First span</span>
    <span>Second span</span>
</body>
</html>

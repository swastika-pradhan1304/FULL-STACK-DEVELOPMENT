<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table basics</title>
    <style>
        table, tr, td, th{
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <caption>My Savings</caption>
    <table> 
        <thead> 
        <tr>
            <td>Month</td>
            <td>Savings</td>
        </tr>
        </thead> 

        <tbody>
        <tr>
            <td>January</td>
            <td>100</td>
        </tr>
        <tr>
            <td>February</td>
            <td>300</td>
        </tr>
        <tr>
            <td>March</td>
            <td>400</td>
        </tr>
        </tbody>

        <tfoot>
        <tr>
            <td>Total</td>
            <td>800</td>
        </tr>
        </tfoot>
    </table>
</body>
</html>

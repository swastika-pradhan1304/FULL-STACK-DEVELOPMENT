<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS gradients</title>
    <style>
        /* linear gradient */
        .box{
            border: 1px solid black;
            height: 200px;
            width: 150px;
            /* by default gradient is from top to down */
            /* can use angles also in place of directions */
            background-image: linear-gradient(red, blue);
            /* towards left */
            background-image: linear-gradient(to left, red, blue);
            /* towards bottom*/
            background-image: linear-gradient(to bottom, red, blue);
            /* towards top */
            background-image: linear-gradient(to top, red, blue);
            /* last line hi pick hoti hai baaki sb override ho jaati hai */
            /* a is transparency */
            background-image: linear-gradient(to bottom, rgba(255,0,0,0), rgba(0,0,255,1));
        }

        /* radial gradient */
        .mydiv{
            border: 1px solid black;
            margin: 10px;
            height: 400px;
            width: 100px;
            background-image: radial-gradient(red, blue, orange);
            /* it will be trimmed and will look like a circle only */
            background-image: radial-gradient(circle, red, blue, orange);
            background-image: radial-gradient(green 5%, red 10%, blue 15%, orange 50%);
        }
    </style>
</head>
<body>
    <div class="box">This is a div element</div>
    <div class="mydiv">This is radial gradient</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow effects in CSS</title>
    <style>
        h1{
            text-shadow: 3px 3px 3px red;
            /* for creating two shadows */
            text-shadow: 3px 3px 3px red, 6px 6px 6px green;
        }
        .box{
            background-color: aqua;
            width: 200px;
            height: 200px;
            /* by default whatever is the color of the text that is same in shadow as well */
            box-shadow: 10px 10px;
            box-shadow: 10px 10px 15px green, 15px 15px 15px brown;
            /* by using negative values we can change the direction */
            box-shadow: -10px -10px 15px green, 15px 15px 15px brown;
            color: red;
        }
    </style>
</head>
<body>
    <!-- text shadow -->
    <h1>This is my heading</h1>

    <!-- box shadow -->
     <div class="box">This is a box</div>
</body>
</html>

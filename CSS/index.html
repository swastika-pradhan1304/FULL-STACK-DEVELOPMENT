<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of styling</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #int-style{
            font-size: larger;
            text-shadow: 1px 1px 2px pink;
        }
    </style>
</head>
<body>
    <!-- inline css -->
    <p style="font-style: italic;">Hello ji, Kaise ho saare</p>

    <!-- internal css -->
    <p id="int-style">Let's add an internal CSS on this</p>
    <hr>

    <!-- external css -->
    <p id="ext-style">Let's apply external styling on this</p>
</body>
</html>

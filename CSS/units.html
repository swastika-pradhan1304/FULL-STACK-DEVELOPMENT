<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding units in CSS</title>
    <style>
        #div1{
            background-color: blueviolet;
            width: 500px;
            height: 100px;
        }
        #div2{
            background-color: aquamarine;
            width: 50%;
            height: 10%;
            margin: 10px;
            padding: 10px;
        }
        #first-para{
            background-color: bisque;
            width: 50vw;
            height: 50vh;
        }
    </style>
</head>
<body>
    <div id="div1">
        <div id="div2"></div>
    </div>

    <p id="first-para">This is my first para</p>
</body>
</html>
